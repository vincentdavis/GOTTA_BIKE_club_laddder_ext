<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - GOTTA.BIKE ladder</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <button id="back-btn" class="icon-btn" title="Back">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
      </button>
      <h1>Settings</h1>
      <div class="header-spacer"></div>
    </div>

    <div class="settings-form">
      <div class="form-group">
        <label for="team-name">Team Name</label>
        <input type="text" id="team-name" placeholder="Enter your team name">
        <p class="form-help">Your team name for personalized features</p>
      </div>
    </div>

    <div id="message" class="message hidden"></div>

    <div class="button-group">
      <button id="save-btn" class="btn btn-primary">Save Settings</button>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
